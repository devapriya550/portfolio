<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #988add;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: rgb(0, 0, 120);
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: center;
            color: white;
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 14px;
            color: #dfd5d5;
            line-height: 1.4;
        }

        .card a {
            text-decoration: none;
            color: white;
            background-color: #333;
            padding: 8px 15px;
            margin: 5px;
            display: inline-block;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .card a:hover {
            background-color: #555;
        }

        /* Hidden project section */
        .projects {
            display: none;
            margin-top: 20px;
            background: white;
            color: black;
            padding: 15px;
            border-radius: 8px;
        }

        .projects input, .projects button {
            padding: 6px;
            margin-top: 8px;
        }

        .projects button {
            background: rgb(0, 0, 120);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .projects button:hover {
            background: #333;
        }
    </style>
</head>

<body>

<div class="card">
    <img src="lady.jpeg" alt="Profile Image">
    <h2>Hi, I'm Deva priya</h2>
    <p>I'm a web developer who loves creating beautiful websites.<br>
    I enjoy learning new technologies and building projects.</p>

    <a href="https://www.linkedin.com" target="_blank">LinkedIn</a>
    <a href="https://github.com" target="_blank">GitHub</a>
    <a onclick="toggleProjects()">My Projects</a>

    <!-- Hidden Age Calculator -->
    <div class="projects" id="projectSection">
        <h3>Age Calculator</h3>

        <label>Enter your birthday:</label><br>
        <input type="date" id="birthday"><br>
        <button onclick="calculateAge()">Calculate Age</button>

        <h4 id="result"></h4>
    </div>
</div>

<script>
    function toggleProjects() {
        const section = document.getElementById("projectSection");
        section.style.display = section.style.display === "block" ? "none" : "block";
    }

    function calculateAge() {
        const birthday = new Date(document.getElementById("birthday").value);
        const today = new Date();

        let age = today.getFullYear() - birthday.getFullYear();
        const monthDifference = today.getMonth() - birthday.getMonth();

        if (
            monthDifference < 0 ||
            (monthDifference === 0 && today.getDate() < birthday.getDate())
        ) {
            age--;
        }

        document.getElementById("result").innerText =
            "Your age is: " + age + " years old";
    }
</script>

</body>
</html>
